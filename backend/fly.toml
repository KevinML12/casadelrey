# Retired backend. Current deployment uses Render; do not deploy this manifest.
# Both Fly machines were stopped. Updating their remote autostart configuration
# was rejected by Fly billing; these local values do not change that remote state.
app = "casa-del-rey-mvp"
primary_region = "dfw"

[env]
  CF_R2_PRIVATE_BUCKET = "casadelreyhue-receipts-private"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = false
  min_machines_running = 0
  processes = ["app"]
