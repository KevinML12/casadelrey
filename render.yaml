# Free testing services. Secrets are entered in Render, never committed.
# Use a separate test database/schema and test storage buckets for this blueprint.
services:
  - type: web
    name: casadelrey-api-pruebas
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: ENV
        value: production
      - key: DB_MAX_OPEN_CONNS
        value: "3"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: BASE_URL
        fromService:
          name: casadelrey-api-pruebas
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CF_R2_ACCOUNT_ID
        sync: false
      - key: CF_R2_ACCESS_KEY
        sync: false
      - key: CF_R2_SECRET_KEY
        sync: false
      - key: CF_R2_BUCKET
        sync: false
      - key: CF_R2_PUBLIC_URL
        sync: false
      - key: CF_R2_PRIVATE_BUCKET
        sync: false

  - type: web
    name: casadelrey-web-pruebas
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
      - key: VITE_API_TIMEOUT_MS
        value: "65000"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://casadelrey-api-pruebas.onrender.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; media-src 'self' https: blob: data:; worker-src 'self' blob:; frame-src https://www.google.com https://maps.google.com https://www.youtube.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
