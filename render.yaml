# Free testing services. Secrets are entered in Render, never committed.
# Use a separate test database/schema and test storage buckets for this blueprint.
services:
  - type: web
    name: casadelrey-api-pruebas
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: BASE_URL
        fromService:
          name: casadelrey-api-pruebas
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CF_R2_ACCOUNT_ID
        sync: false
      - key: CF_R2_ACCESS_KEY
        sync: false
      - key: CF_R2_SECRET_KEY
        sync: false
      - key: CF_R2_BUCKET
        sync: false
      - key: CF_R2_PUBLIC_URL
        sync: false
      - key: CF_R2_PRIVATE_BUCKET
        sync: false

  - type: web
    name: casadelrey-web-pruebas
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
