name: Encrypted recovery backup
# Daily at 03:00 America/Guatemala (09:00 UTC), following a successful manual run.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
permissions:
  contents: read
concurrency:
  group: recovery-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare private runtime
        env:
          CDR_DATABASE_URL: ${{ secrets.CDR_BACKUP_DATABASE_URL }}
          CDR_R2_ACCOUNT: ${{ secrets.CDR_R2_ACCOUNT_ID }}
          CDR_R2_ACCESS: ${{ secrets.CDR_R2_ACCESS_KEY }}
          CDR_R2_SECRET: ${{ secrets.CDR_R2_SECRET_KEY }}
          CDR_R2_MEDIA: ${{ secrets.CDR_R2_MEDIA_BUCKET }}
          CDR_R2_PRIVATE: ${{ secrets.CDR_R2_PRIVATE_BUCKET }}
          CDR_R2_PUBLIC_URL: ${{ secrets.CDR_R2_PUBLIC_URL }}
          CDR_KEY: ${{ secrets.CDR_BACKUP_KEY_BASE64 }}
        run: python3 ops/prepare_backup_runner.py
      - name: Build maintenance utility
        working-directory: backend
        run: go build -trimpath -o "$RUNNER_TEMP/cdr-operations/maintenance" ./cmd/maintenance
      - name: Install PostgreSQL clients in disposable containers
        run: |
          docker pull postgres:18-alpine
          mkdir -p "$RUNNER_TEMP/cdr-bin"
          cp ops/postgres-client "$RUNNER_TEMP/cdr-bin/pg_dump"
          cp ops/postgres-client "$RUNNER_TEMP/cdr-bin/psql"
          cp ops/postgres-client "$RUNNER_TEMP/cdr-bin/pg_restore"
          chmod 700 "$RUNNER_TEMP/cdr-bin/pg_dump" "$RUNNER_TEMP/cdr-bin/psql" "$RUNNER_TEMP/cdr-bin/pg_restore"
          echo "$RUNNER_TEMP/cdr-bin" >> "$GITHUB_PATH"
      - name: Back up active database and files
        run: python3 ops/recovery.py backup --active-only --storage --environment "$RUNNER_TEMP/cdr-operations/environment.json"
# No plaintext databases, keys, manifests or receipts are published as artifacts.
